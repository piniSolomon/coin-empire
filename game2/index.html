<script>
// ========== GAME CONFIG ==========
const GRID_SIZE = 5;
const VERSION = '1.0.0';

// ========== GAME STATE ==========
let grid = [];
let score = 0;
let bestScore = parseInt(localStorage.getItem('mergeChainBest') || '0');
let nextTile = 2;
let undosLeft = 3;
let totalChains = 0;
let bestChain = 0;
let highestTile = 0;
let gamesPlayed = parseInt(localStorage.getItem('mergeChainGames') || '0');
let prevState = null; // for undo
let isAnimating = false;
let comboTimeout = null;
let soundEnabled = localStorage.getItem('mergeChainSound') !== 'off';
let continued = false; // track if player already continued this game

// ========== AUDIO ==========
let audioCtx = null;

function getAudioCtx() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
}

function playSound(freq, duration, type = 'sine') {
    if (!soundEnabled) return;
    try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
    } catch(e) {}
}

function playMergeSound(chainLevel) {
    // Higher pitch for longer chains
    const baseFreq = 400 + (chainLevel * 100);
    playSound(baseFreq, 0.15, 'sine');
    setTimeout(() => playSound(baseFreq * 1.25, 0.1, 'sine'), 50);
}

function playPlaceSound() {
    playSound(300, 0.08, 'triangle');
}

function playGameOverSound() {
    playSound(200, 0.3, 'sawtooth');
    setTimeout(() => playSound(150, 0.4, 'sawtooth'), 150);
}

// ========== GRID OPERATIONS ==========

function initGrid() {
    grid = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(0));
}

function getEmptyCells() {
    const empty = [];
    for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
            if (grid[r][c] === 0) empty.push([r, c]);
        }
    }
    return empty;
}

function generateNextTile() {
    // Weighted: mostly 2s and 4s, occasionally 8
    const roll = Math.random();
    if (roll < 0.65) return 2;
    if (roll < 0.90) return 4;
    return 8;
}

function cloneGrid() {
    return grid.map(row => [...row]);
}

// ========== MERGE LOGIC (CHAIN REACTION) ==========

function findMerges() {
    // Find all groups of 3+ adjacent same-value cells
    const visited = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(false));
    const groups = [];

    for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
            if (grid[r][c] === 0 || visited[r][c]) continue;

            // BFS to find connected group of same value
            const val = grid[r][c];
            const group = [];
            const queue = [[r, c]];
            visited[r][c] = true;

            while (queue.length > 0) {
                const [cr, cc] = queue.shift();
                group.push([cr, cc]);

                // Check 4 neighbors
                const neighbors = [[cr-1,cc],[cr+1,cc],[cr,cc-1],[cr,cc+1]];
                for (const [nr, nc] of neighbors) {
                    if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE
                        && !visited[nr][nc] && grid[nr][nc] === val) {
                        visited[nr][nc] = true;
                        queue.push([nr, nc]);
                    }
                }
            }

            if (group.length >= 3) {
                groups.push({ val, cells: group });
            }
        }
    }

    return groups;
}

async function processMerges() {
    let chainLevel = 0;

    while (true) {
        const groups = findMerges();
        if (groups.length === 0) break;

        chainLevel++;
        totalChains++;
        if (chainLevel > bestChain) bestChain = chainLevel;

        for (const group of groups) {
            const newVal = group.val * 2;
            const points = newVal * group.cells.length * chainLevel;
            score += points;
            if (newVal > highestTile) highestTile = newVal;

            // Clear all cells in group except one (which becomes the merged value)
            const keepCell = group.cells[0];
            for (const [r, c] of group.cells) {
                grid[r][c] = 0;
            }
            grid[keepCell[0]][keepCell[1]] = newVal;

            // Animate
            playMergeSound(chainLevel);
            renderGrid(keepCell, chainLevel > 1);

            if (chainLevel > 1) {
                showCombo(chainLevel);
            }
        }

        // Wait for animation
        await sleep(250);

        // Gravity: tiles fall down to fill gaps
        applyGravity();
        renderGrid();
        await sleep(150);
    }

    return chainLevel;
}

function applyGravity() {
    for (let c = 0; c < GRID_SIZE; c++) {
        // Collect non-zero values from bottom to top
        const col = [];
        for (let r = GRID_SIZE - 1; r >= 0; r--) {
            if (grid[r][c] !== 0) col.push(grid[r][c]);
        }
        // Fill column from bottom
        for (let r = GRID_SIZE - 1; r >= 0; r--) {
            grid[r][c] = col.length > 0 ? col.shift() : 0;
        }
    }
}

// ========== PLACE TILE ==========

async function placeTile(row, col) {
    if (isAnimating || grid[row][col] !== 0) return;
    isAnimating = true;

    // Save state for undo
    prevState = { grid: cloneGrid(), score, nextTile, undosLeft };

    // Place the tile
    grid[row][col] = nextTile;
    playPlaceSound();
    renderGrid([row, col]);

    await sleep(100);

    // Process chain reactions
    await processMerges();

    // Generate next tile
    nextTile = generateNextTile();
    updateNextPreview();
    updateScore();

    // Check game over
    if (getEmptyCells().length === 0) {
        // One final check — are there any possible merges with current board?
        const possibleMerges = findMerges();
        if (possibleMerges.length === 0) {
            gameOver();
        }
    }

    isAnimating = false;
}

// ========== GAME OVER ==========

function gameOver() {
    playGameOverSound();

    if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('mergeChainBest', bestScore.toString());
    }

    gamesPlayed++;
    localStorage.setItem('mergeChainGames', gamesPlayed.toString());

    document.getElementById('final-score').textContent = score;
    document.getElementById('stat-chains').textContent = totalChains;
    document.getElementById('stat-best-chain').textContent = bestChain;
    document.getElementById('stat-highest').textContent = highestTile;
    document.getElementById('game-over').classList.add('active');

    // Show interstitial ad at game over (natural break point)
    showInterstitialAd();
}

// ========== UNDO ==========

function undo() {
    if (!prevState || undosLeft <= 0) return;
    grid = prevState.grid;
    score = prevState.score;
    nextTile = prevState.nextTile;
    undosLeft--;
    prevState = null;
    renderGrid();
    updateScore();
    updateUndoBtn();
}

// ========== NEW GAME ==========

function newGame() {
    document.getElementById('game-over').classList.remove('active');
    initGrid();
    score = 0;
    totalChains = 0;
    bestChain = 0;
    highestTile = 0;
    undosLeft = 3;
    continued = false;
    nextTile = generateNextTile();
    prevState = null;
    isAnimating = false;

    // Place 3 random starting tiles
    for (let i = 0; i < 3; i++) {
        const empty = getEmptyCells();
        if (empty.length > 0) {
            const [r, c] = empty[Math.floor(Math.random() * empty.length)];
            grid[r][c] = generateNextTile();
        }
    }

    renderGrid();
    updateScore();
    updateNextPreview();
    updateUndoBtn();
}

// ========== UI RENDERING ==========

function renderGrid(highlightCell, isChain) {
    const gridEl = document.getElementById('grid');
    gridEl.innerHTML = '';

    for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
            const cell = document.createElement('div');
            const val = grid[r][c];
            cell.className = 'cell' + (val === 0 ? ' empty' : ` val-${val}`);

            if (highlightCell && highlightCell[0] === r && highlightCell[1] === c) {
                cell.classList.add(isChain ? 'chain' : 'merging');
            }

            if (val > 0) {
                cell.textContent = val;
            }

            cell.addEventListener('click', () => placeTile(r, c));
            cell.addEventListener('touchend', (e) => {
                e.preventDefault();
                placeTile(r, c);
            });

            gridEl.appendChild(cell);
        }
    }
}

function updateScore() {
    document.getElementById('score').textContent = score;
    document.getElementById('best').textContent = bestScore;
}

function updateNextPreview() {
    const el = document.getElementById('next-preview');
    el.textContent = nextTile;
    el.className = `next-preview val-${nextTile}`;
}

function updateUndoBtn() {
    const btn = document.getElementById('btn-undo');
    btn.textContent = `↩ Undo (${undosLeft})`;
    btn.disabled = undosLeft <= 0 || !prevState;
}

function showCombo(level) {
    const el = document.getElementById('combo-display');
    const messages = ['', '', 'Double Chain! 🔥', 'Triple Chain! ⚡', 'MEGA CHAIN! 💥', 'INSANE! 🌟'];
    el.textContent = messages[Math.min(level, messages.length - 1)] || `${level}x CHAIN! 🌟`;
    el.style.opacity = '1';

    clearTimeout(comboTimeout);
    comboTimeout = setTimeout(() => { el.style.opacity = '0'; }, 2000);
}

// ========== AD INTEGRATION ==========

function showInterstitialAd() {
    if (typeof adBreak === 'function') {
        adBreak({
            type: 'next',
            name: 'game-over',
            beforeAd: () => {},
            afterAd: () => {},
            adBreakDone: () => {}
        });
    }
}

function watchAdForUndos() {
    if (typeof adBreak === 'function') {
        adBreak({
            type: 'reward',
            name: 'undo-reward',
            beforeAd: () => {},
            afterAd: () => {},
            beforeReward: (showAdFn) => { showAdFn(); },
            adDismissed: () => {},
            adViewed: () => {
                grantUndos();
            },
            adBreakDone: () => {}
        });
    } else {
        // No ad SDK — simulate for testing
        grantUndos();
    }
}

function watchAdContinue() {
    if (continued) return; // only one continue per game
    if (typeof adBreak === 'function') {
        adBreak({
            type: 'reward',
            name: 'continue-reward',
            beforeAd: () => {},
            afterAd: () => {},
            beforeReward: (showAdFn) => { showAdFn(); },
            adDismissed: () => {},
            adViewed: () => {
                continueGame();
            },
            adBreakDone: () => {}
        });
    } else {
        continueGame();
    }
}

function grantUndos() {
    undosLeft += 3;
    updateUndoBtn();
}

function continueGame() {
    continued = true;
    document.getElementById('game-over').classList.remove('active');
    // Remove 5 random tiles to give space
    const filled = [];
    for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
            if (grid[r][c] !== 0) filled.push([r, c]);
        }
    }
    // Sort by value (remove lowest first)
    filled.sort((a, b) => grid[a[0]][a[1]] - grid[b[0]][b[1]]);
    const toRemove = Math.min(5, filled.length);
    for (let i = 0; i < toRemove; i++) {
        const [r, c] = filled[i];
        grid[r][c] = 0;
    }
    applyGravity();
    renderGrid();
    updateScore();
}

// ========== UTILITIES ==========

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// ========== SOUND TOGGLE ==========

document.getElementById('sound-toggle').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    localStorage.setItem('mergeChainSound', soundEnabled ? 'on' : 'off');
    document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';
});
document.getElementById('sound-toggle').textContent = soundEnabled ? '🔊' : '🔇';

// ========== BUTTON HANDLERS ==========

document.getElementById('btn-undo').addEventListener('click', undo);
document.getElementById('btn-new').addEventListener('click', newGame);
document.getElementById('btn-reward').addEventListener('click', watchAdForUndos);

// ========== SAVE BEST SCORE ==========

window.addEventListener('beforeunload', () => {
    if (score > bestScore) {
        localStorage.setItem('mergeChainBest', score.toString());
    }
});

// ========== TUTORIAL ==========

function showTutorial() {
    const overlay = document.createElement('div');
    overlay.className = 'overlay active';
    overlay.innerHTML = `
        <h2 style="font-size:1.5em">How to Play</h2>
        <div style="text-align:left;max-width:300px;line-height:1.6;font-size:0.9em;color:#ccc">
            <p>👆 <strong>Tap an empty cell</strong> to place the next tile.</p>
            <p>🔗 When <strong>3+ adjacent tiles</strong> of the same number touch, they <strong>merge</strong> into a higher number!</p>
            <p>⬇️ After merges, tiles <strong>fall down</strong> with gravity — this can trigger <strong>chain reactions</strong>!</p>
            <p>⚡ Longer chains = <strong>bigger score multipliers</strong>.</p>
            <p>↩️ Use <strong>Undo</strong> to take back a move (limited uses).</p>
            <p>🎯 <strong>Game over</strong> when the grid is full with no possible merges.</p>
        </div>
        <button class="btn btn-new" style="width:200px;margin-top:16px" onclick="this.parentElement.remove()">Got it!</button>
    `;
    document.body.appendChild(overlay);
}

// Show tutorial on first visit
if (!localStorage.getItem('mergeChainPlayed')) {
    setTimeout(showTutorial, 500);
    localStorage.setItem('mergeChainPlayed', '1');
}

// ========== START GAME ==========
newGame();
