<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Build your business empire from a lemonade stand to a space corporation! Free idle tycoon game - click, earn, upgrade, and go public!">
    <meta name="keywords" content="idle game, clicker game, tycoon game, free browser game, coin empire">
    <meta name="theme-color" content="#1a1a2e">

    <!-- Open Graph -->
    <meta property="og:title" content="Coin Empire - Idle Tycoon">
    <meta property="og:description" content="Build your business empire! Free idle tycoon game in your browser.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://pinisolomon.github.io/coin-empire/">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Coin Empire - Idle Tycoon">
    <meta name="twitter:description" content="Build your business empire! Free idle tycoon game.">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">

    <title>Coin Empire - Idle Tycoon</title>
    <!-- Google Ad Placement API — replace ca-pub-XXXXXXX with real publisher ID -->
    <script async
        data-ad-frequency-hint="30s"
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXX"
        crossorigin="anonymous">
    </script>
    <script>
        window.adsbygoogle = window.adsbygoogle || [];
        window._adsReady = false;
        var adBreak = adConfig = function(o) { adsbygoogle.push(o); };
        // Detect when real SDK loads
        var _origPush = adsbygoogle.push;
        adsbygoogle.push = function(o) {
            if (o && o.preloadAdBreaks) window._adsReady = true;
            return _origPush.call(adsbygoogle, o);
        };
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 15px 10px;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .header h1 { font-size: 1.4em; color: #ffd700; text-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .header .coins-display {
            font-size: 1.8em;
            font-weight: bold;
            color: #ffd700;
            margin-top: 5px;
        }
        .header .coins-per-sec {
            font-size: 0.85em;
            color: #aaa;
        }

        /* Click Area */
        .click-area {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }
        .coin-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            background: radial-gradient(circle at 35% 35%, #ffe066, #ffd700, #cc9900);
            font-size: 3em;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 0 30px rgba(255,215,0,0.3), inset 0 -3px 6px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .coin-button:active {
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(255,215,0,0.5);
        }
        .coin-button:hover {
            box-shadow: 0 0 40px rgba(255,215,0,0.5);
        }

        /* Click floating text */
        .click-text {
            position: fixed;
            color: #ffd700;
            font-weight: bold;
            font-size: 1.2em;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-60px); }
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85em;
            transition: background 0.2s;
            border-bottom: 2px solid transparent;
        }
        .tab:hover { background: rgba(255,255,255,0.05); }
        .tab.active {
            background: rgba(255,255,255,0.08);
            border-bottom-color: #ffd700;
            color: #ffd700;
        }

        /* Panels */
        .panel { display: none; padding: 10px; }
        .panel.active { display: block; }

        /* Business Cards */
        .business-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: border-color 0.2s;
        }
        .business-card:hover { border-color: rgba(255,215,0,0.3); }
        .business-card.locked { opacity: 0.4; }
        .business-icon { font-size: 2.2em; width: 50px; text-align: center; }
        .business-info { flex: 1; }
        .business-name { font-weight: bold; font-size: 0.95em; }
        .business-stats { font-size: 0.75em; color: #aaa; margin-top: 2px; }
        .business-owned { color: #ffd700; font-size: 0.75em; }

        .buy-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            font-weight: bold;
            font-size: 0.8em;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            min-width: 80px;
            text-align: center;
        }
        .buy-btn:hover { transform: scale(1.05); }
        .buy-btn:active { transform: scale(0.95); }
        .buy-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

        /* Progress bar for business production */
        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 5px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ff8c00);
            border-radius: 2px;
            transition: width 0.1s linear;
        }

        /* Upgrade Cards */
        .upgrade-card {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .upgrade-card.purchased { opacity: 0.4; border-color: #4caf50; }
        .upgrade-icon { font-size: 1.5em; width: 35px; text-align: center; }
        .upgrade-info { flex: 1; }
        .upgrade-name { font-weight: bold; font-size: 0.85em; }
        .upgrade-desc { font-size: 0.7em; color: #aaa; }

        /* Prestige Panel */
        .prestige-box {
            background: rgba(147,51,234,0.15);
            border: 1px solid rgba(147,51,234,0.3);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin: 10px 0;
        }
        .prestige-box h3 { color: #a78bfa; margin-bottom: 10px; }
        .prestige-multiplier { font-size: 2em; color: #ffd700; font-weight: bold; }
        .prestige-btn {
            margin-top: 15px;
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            color: white;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .prestige-btn:hover { transform: scale(1.05); }
        .prestige-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Stats Panel */
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85em;
        }
        .stat-label { color: #aaa; }
        .stat-value { color: #ffd700; font-weight: bold; }

        /* Reward Ad Button */
        .reward-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px dashed rgba(255,215,0,0.3);
            border-radius: 10px;
            background: rgba(255,215,0,0.05);
            color: #ffd700;
            font-size: 0.85em;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }
        .reward-btn:hover { background: rgba(255,215,0,0.1); }
        .reward-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Notification toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(76,175,80,0.95);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 0.85em;
            z-index: 1000;
            animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2s forwards;
            pointer-events: none;
        }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
        @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

        /* Responsive */
        @media (min-width: 600px) {
            body { display: flex; justify-content: center; }
            .game-container { width: 400px; }
        }

        /* Ad placeholder */
        .ad-slot {
            background: rgba(255,255,255,0.03);
            border: 1px dashed rgba(255,255,255,0.1);
            text-align: center;
            padding: 8px;
            font-size: 0.7em;
            color: #555;
            margin: 5px 0;
        }

        /* Particle effects */
        .particle {
            position: fixed;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #ffd700;
            pointer-events: none;
            z-index: 99;
            animation: particleFly 0.6s ease-out forwards;
        }
        @keyframes particleFly {
            0% { opacity: 1; transform: translate(0,0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
        }

        /* Onboarding overlay */
        .onboarding {
            position: fixed;
            z-index: 500;
            pointer-events: none;
        }
        .onboarding-hint {
            position: fixed;
            background: rgba(255,215,0,0.95);
            color: #1a1a2e;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 0.9em;
            z-index: 501;
            animation: hintBounce 1.5s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes hintBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Daily reward / offline earnings modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; } }
        .modal-box {
            background: linear-gradient(135deg, #1a1a3e, #2a2a5e);
            border: 2px solid rgba(255,215,0,0.3);
            border-radius: 16px;
            padding: 25px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } }
        .modal-title { color: #ffd700; font-size: 1.3em; margin-bottom: 10px; }
        .modal-reward { font-size: 2em; color: #ffd700; font-weight: bold; margin: 15px 0; }
        .modal-streak { font-size: 0.85em; color: #a78bfa; margin-bottom: 15px; }
        .modal-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a2e;
            font-weight: bold;
            font-size: 1em;
            cursor: pointer;
            margin: 5px;
            transition: transform 0.1s;
        }
        .modal-btn:hover { transform: scale(1.05); }
        .modal-btn.secondary {
            background: linear-gradient(135deg, #9333ea, #7c3aed);
            color: white;
        }
    </style>
</head>
<body>

<div class="game-container">
    <!-- Header -->
    <div class="header">
        <h1>Coin Empire</h1>
        <div class="coins-display" id="coins-display">0</div>
        <div class="coins-per-sec"><span id="cps-display">0</span> coins/sec</div>
    </div>

    <!-- Click Area -->
    <div class="click-area">
        <div class="coin-button" id="coin-button" role="button" tabindex="0">
            <span>&#x1fa99;</span>
        </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" data-tab="businesses">Businesses</div>
        <div class="tab" data-tab="upgrades">Upgrades</div>
        <div class="tab" data-tab="prestige">Prestige</div>
        <div class="tab" data-tab="stats">Stats</div>
    </div>

    <!-- Businesses Panel -->
    <div class="panel active" id="panel-businesses"></div>

    <!-- Upgrades Panel -->
    <div class="panel" id="panel-upgrades"></div>

    <!-- Prestige Panel -->
    <div class="panel" id="panel-prestige"></div>

    <!-- Stats Panel -->
    <div class="panel" id="panel-stats"></div>

    <!-- Ad slot placeholder -->
    <div class="ad-slot" id="ad-banner">Ad Space</div>
</div>

<script>
// ========== GAME DATA ==========
const BUSINESSES = [
    { id: 'lemonade',   name: 'Lemonade Stand', icon: '🍋', baseCost: 10,      baseIncome: 1,       costMult: 1.15, time: 1000 },
    { id: 'coffee',     name: 'Coffee Shop',     icon: '☕',       baseCost: 100,     baseIncome: 5,       costMult: 1.15, time: 2000 },
    { id: 'restaurant', name: 'Restaurant',       icon: '🍽️', baseCost: 1000,    baseIncome: 25,      costMult: 1.15, time: 4000 },
    { id: 'techco',     name: 'Tech Startup',     icon: '💻', baseCost: 12000,   baseIncome: 120,     costMult: 1.15, time: 8000 },
    { id: 'spacecorp',  name: 'Space Corp',       icon: '🚀', baseCost: 150000,  baseIncome: 600,     costMult: 1.15, time: 15000 },
];

const UPGRADES = [
    { id: 'click1',    name: 'Better Fingers',     icon: '👆', desc: '2x click power',         cost: 100,     type: 'click', mult: 2 },
    { id: 'click2',    name: 'Golden Touch',        icon: '✨',       desc: '3x click power',         cost: 5000,    type: 'click', mult: 3 },
    { id: 'biz1',      name: 'Fresh Lemons',        icon: '🍋', desc: '2x Lemonade income',     cost: 500,     type: 'business', target: 'lemonade', mult: 2 },
    { id: 'biz2',      name: 'Premium Beans',       icon: '☕',       desc: '2x Coffee income',       cost: 5000,    type: 'business', target: 'coffee', mult: 2 },
    { id: 'biz3',      name: 'Michelin Star',        icon: '⭐',       desc: '2x Restaurant income',   cost: 50000,   type: 'business', target: 'restaurant', mult: 2 },
    { id: 'biz4',      name: 'AI Integration',      icon: '🤖', desc: '2x Tech Startup income', cost: 500000,  type: 'business', target: 'techco', mult: 2 },
    { id: 'biz5',      name: 'Warp Drive',          icon: '👾', desc: '2x Space Corp income',   cost: 5000000, type: 'business', target: 'spacecorp', mult: 2 },
    { id: 'speed1',    name: 'Efficiency Boost',    icon: '⚡',       desc: 'All businesses 20% faster', cost: 10000, type: 'speed', mult: 0.8 },
    { id: 'speed2',    name: 'Quantum Efficiency',  icon: '🔬', desc: 'All businesses 30% faster', cost: 200000, type: 'speed', mult: 0.7 },
];

// ========== GAME STATE ==========
let state = {
    coins: 0,
    totalCoins: 0,
    totalClicks: 0,
    clickPower: 1,
    prestigeLevel: 0,
    prestigeMultiplier: 1,
    businesses: {},
    upgrades: {},
    managers: {},
    startTime: Date.now(),
    lastSave: Date.now(),
    lastOnline: Date.now(),
    totalPlayTime: 0,
    // Ad tracking
    adsWatched: 0,
    boostActive: false,
    boostEnd: 0,
    // Daily reward
    lastDailyReward: 0,
    dailyStreak: 0,
};

// Initialize business state
BUSINESSES.forEach(b => {
    state.businesses[b.id] = { owned: 0, progress: 0 };
});

// ========== CORE FUNCTIONS ==========

function formatNumber(n) {
    if (n < 1000) return Math.floor(n).toLocaleString();
    const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc'];
    const tier = Math.floor(Math.log10(Math.abs(n)) / 3);
    if (tier === 0) return Math.floor(n).toLocaleString();
    const suffix = suffixes[Math.min(tier, suffixes.length - 1)];
    const scale = Math.pow(10, tier * 3);
    const scaled = n / scale;
    return scaled.toFixed(scaled < 10 ? 2 : scaled < 100 ? 1 : 0) + suffix;
}

function getBusinessCost(biz, owned) {
    return Math.floor(biz.baseCost * Math.pow(biz.costMult, owned));
}

function getBusinessIncome(biz, bizState) {
    let income = biz.baseIncome * bizState.owned;
    // Apply upgrade multipliers
    UPGRADES.forEach(u => {
        if (u.type === 'business' && u.target === biz.id && state.upgrades[u.id]) {
            income *= u.mult;
        }
    });
    // Apply prestige multiplier
    income *= state.prestigeMultiplier;
    // Apply boost
    if (state.boostActive && Date.now() < state.boostEnd) {
        income *= 2;
    }
    return income;
}

function getBusinessTime(biz) {
    let time = biz.time;
    UPGRADES.forEach(u => {
        if (u.type === 'speed' && state.upgrades[u.id]) {
            time *= u.mult;
        }
    });
    return time;
}

function getTotalCPS() {
    let cps = 0;
    BUSINESSES.forEach(b => {
        const bs = state.businesses[b.id];
        if (bs.owned > 0 && state.managers[b.id]) {
            const income = getBusinessIncome(b, bs);
            const time = getBusinessTime(b);
            cps += income / (time / 1000);
        }
    });
    return cps;
}

function getClickValue() {
    let power = state.clickPower;
    UPGRADES.forEach(u => {
        if (u.type === 'click' && state.upgrades[u.id]) {
            power *= u.mult;
        }
    });
    power *= state.prestigeMultiplier;
    if (state.boostActive && Date.now() < state.boostEnd) power *= 2;
    return power;
}

function getPrestigeCoins() {
    // Prestige coins based on total earned this run
    return Math.floor(Math.pow(state.totalCoins / 1000000, 0.5));
}

// ========== CLICK HANDLER ==========

function handleClick(e) {
    const value = getClickValue();
    state.coins += value;
    state.totalCoins += value;
    state.totalClicks++;

    // Analytics
    analytics.track('click', { v: value });

    // Particles
    const rect = document.getElementById('coin-button').getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    for (let i = 0; i < 5; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = Math.random() * Math.PI * 2;
        const dist = 40 + Math.random() * 50;
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
        p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
        p.style.background = ['#ffd700','#ff8c00','#ffe066','#fff'][Math.floor(Math.random()*4)];
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 600);
    }

    // Floating text
    const el = document.createElement('div');
    el.className = 'click-text';
    el.textContent = '+' + formatNumber(value);
    el.style.left = (rect.left + rect.width / 2 - 20 + (Math.random() * 40 - 20)) + 'px';
    el.style.top = (rect.top - 10) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 800);

    updateUI();
}

// ========== BUY BUSINESS ==========

function buyBusiness(bizId) {
    const biz = BUSINESSES.find(b => b.id === bizId);
    const bs = state.businesses[bizId];
    const cost = getBusinessCost(biz, bs.owned);
    if (state.coins >= cost) {
        state.coins -= cost;
        bs.owned++;
        analytics.track('buy', { biz: bizId, count: bs.owned, cost });
        showToast(`Bought ${biz.icon} ${biz.name}! (${bs.owned} owned)`);
        updateUI();
    }
}

// ========== BUY MANAGER ==========

function buyManager(bizId) {
    const biz = BUSINESSES.find(b => b.id === bizId);
    const cost = getBusinessCost(biz, 0) * 10;
    if (state.coins >= cost && !state.managers[bizId]) {
        state.coins -= cost;
        state.managers[bizId] = true;
        analytics.track('manager', { biz: bizId, cost });
        showToast(`Hired manager for ${biz.icon} ${biz.name}!`);
        updateUI();
    }
}

// ========== BUY UPGRADE ==========

function buyUpgrade(upgradeId) {
    const upgrade = UPGRADES.find(u => u.id === upgradeId);
    if (state.coins >= upgrade.cost && !state.upgrades[upgradeId]) {
        state.coins -= upgrade.cost;
        state.upgrades[upgradeId] = true;
        analytics.track('upgrade', { id: upgradeId, cost: upgrade.cost });
        showToast(`Purchased ${upgrade.icon} ${upgrade.name}!`);
        updateUI();
    }
}

// ========== PRESTIGE ==========

function doPrestige() {
    const prestigeCoins = getPrestigeCoins();
    if (prestigeCoins < 1) return;

    // Show interstitial ad on prestige (natural break point)
    const applyPrestige = () => {
        state.prestigeLevel++;
        state.prestigeMultiplier = 1 + (state.prestigeLevel * 0.5);
        analytics.track('prestige', { level: state.prestigeLevel, mult: state.prestigeMultiplier });

        // Reset progress
        state.coins = 0;
        state.totalCoins = 0;
        BUSINESSES.forEach(b => {
            state.businesses[b.id] = { owned: 0, progress: 0 };
        });
        state.upgrades = {};
        state.managers = {};
        state.clickPower = 1;
        state.boostActive = false;
        state.boostEnd = 0;

        showToast(`Went Public! Prestige level ${state.prestigeLevel} (${state.prestigeMultiplier}x multiplier)`);
        updateUI();
        saveGame();
    };

    if (window._adsReady) {
        adBreak({
            type: 'next',
            name: 'prestige-break',
            beforeAd: function() { /* pause game */ },
            afterAd: function() { applyPrestige(); },
            adBreakDone: function(info) {
                if (info.breakStatus !== 'viewed') applyPrestige();
            }
        });
    } else {
        applyPrestige();
    }
}

// ========== REWARD AD (simulated for MVP) ==========

function watchRewardAd() {
    if (state.boostActive && Date.now() < state.boostEnd) return;

    // Try real ad SDK first, fallback to simulated
    // adsbygoogle.loaded is set to true only when the real SDK finishes loading
    if (window._adsReady) {
        adBreak({
            type: 'reward',
            name: 'boost-2x',
            beforeReward: function(showAdFn) { showAdFn(); },
            adViewed: function() {
                state.boostActive = true;
                state.boostEnd = Date.now() + 300000;
                state.adsWatched++;
                showToast('2x Boost activated for 5 minutes!');
                updateUI();
            },
            adDismissed: function() {
                showToast('Ad skipped — no boost applied.');
            },
            adBreakDone: function(info) {
                console.log('Reward ad break:', info.breakStatus);
            }
        });
    } else {
        // Simulated ad for development/testing
        state.boostActive = true;
        state.boostEnd = Date.now() + 300000;
        state.adsWatched++;
        analytics.track('ad_watched', { type: 'reward_simulated' });
        showToast('2x Boost activated for 5 minutes! (simulated ad)');
        updateUI();
    }
}

// ========== TOAST ==========

function showToast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 2500);
}

// ========== GAME LOOP ==========

let lastTick = Date.now();

function gameTick() {
    const now = Date.now();
    const dt = now - lastTick;
    lastTick = now;

    // Update businesses
    BUSINESSES.forEach(b => {
        const bs = state.businesses[b.id];
        if (bs.owned <= 0) return;

        const hasManager = state.managers[b.id];
        if (!hasManager) return; // Manual businesses don't auto-produce (click each one)

        const time = getBusinessTime(b);
        bs.progress += dt;

        while (bs.progress >= time) {
            bs.progress -= time;
            const income = getBusinessIncome(b, bs);
            state.coins += income;
            state.totalCoins += income;
        }
    });

    // Check boost expiry
    if (state.boostActive && Date.now() >= state.boostEnd) {
        state.boostActive = false;
        showToast('2x Boost expired!');
    }

    state.totalPlayTime += dt;
    // Only update header numbers on tick, not full panels
    document.getElementById('coins-display').textContent = formatNumber(state.coins);
    document.getElementById('cps-display').textContent = formatNumber(getTotalCPS());
    // Update progress bars without full re-render
    updateProgressBars();
}

function updateProgressBars() {
    BUSINESSES.forEach(b => {
        const bs = state.businesses[b.id];
        if (bs.owned <= 0) return;
        const time = getBusinessTime(b);
        const pct = (bs.progress / time * 100);
        const bar = document.querySelector(`[data-progress="${b.id}"]`);
        if (bar) bar.style.width = pct + '%';
    });
    // Update boost timer text
    const boostBtn = document.querySelector('.reward-btn');
    if (boostBtn && state.boostActive && Date.now() < state.boostEnd) {
        const rem = Math.ceil((state.boostEnd - Date.now()) / 1000);
        boostBtn.textContent = `✨ 2x Boost Active (${Math.floor(rem/60)}:${String(rem%60).padStart(2,'0')} left)`;
    }
}

// ========== COLLECT (manual business) ==========

function collectBusiness(bizId) {
    const biz = BUSINESSES.find(b => b.id === bizId);
    const bs = state.businesses[bizId];
    if (bs.owned <= 0 || state.managers[bizId]) return;

    const time = getBusinessTime(biz);
    bs.progress += time; // Instantly complete one cycle
    if (bs.progress >= time) {
        bs.progress = 0;
        const income = getBusinessIncome(biz, bs);
        state.coins += income;
        state.totalCoins += income;
        analytics.track('collect', { biz: bizId, income });

        // Show "Watch ad to double?" modal for larger collections
        if (income >= 50) {
            showModal(
                `${biz.icon} Collected!`,
                `<div class="modal-reward">+${formatNumber(income)} coins</div>`,
                [
                    { text: 'OK', action: () => updateUI() },
                    { text: '🎥 2x (Watch Ad)', secondary: true, action: () => {
                        state.coins += income;
                        state.totalCoins += income;
                        state.adsWatched++;
                        analytics.track('ad_watched', { type: 'double_collect', biz: bizId, income });
                        showToast(`Doubled! +${formatNumber(income * 2)} total!`);
                        updateUI();
                    }}
                ]
            );
        } else {
            const el = document.createElement('div');
            el.className = 'click-text';
            el.textContent = '+' + formatNumber(income);
            el.style.left = '50%';
            el.style.top = '50%';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }
    }
    updateUI();
}

// ========== UI RENDERING ==========

function updateUI() {
    // Header
    document.getElementById('coins-display').textContent = formatNumber(state.coins);
    document.getElementById('cps-display').textContent = formatNumber(getTotalCPS());

    // Only re-render panels if visible (performance)
    const activeTab = document.querySelector('.tab.active')?.dataset.tab;
    if (activeTab === 'businesses') renderBusinesses();
    else if (activeTab === 'upgrades') renderUpgrades();
    else if (activeTab === 'prestige') renderPrestige();
    else if (activeTab === 'stats') renderStats();
}

function renderBusinesses() {
    const panel = document.getElementById('panel-businesses');
    let html = '';

    // Reward ad button
    const boostActive = state.boostActive && Date.now() < state.boostEnd;
    const boostRemaining = boostActive ? Math.ceil((state.boostEnd - Date.now()) / 1000) : 0;
    html += `<button class="reward-btn" data-action="reward-ad" ${boostActive ? 'disabled' : ''}>
        ${boostActive
            ? `✨ 2x Boost Active (${Math.floor(boostRemaining/60)}:${String(boostRemaining%60).padStart(2,'0')} left)`
            : '🎥 Watch Ad for 2x Boost (5 min)'}
    </button>`;

    BUSINESSES.forEach((b, i) => {
        const bs = state.businesses[b.id];
        const cost = getBusinessCost(b, bs.owned);
        const canBuy = state.coins >= cost;
        const income = getBusinessIncome(b, bs);
        const time = getBusinessTime(b);
        const hasManager = state.managers[b.id];
        const managerCost = getBusinessCost(b, 0) * 10;
        const progress = bs.owned > 0 ? (bs.progress / time * 100) : 0;
        const unlocked = i === 0 || state.businesses[BUSINESSES[i-1].id].owned > 0;

        html += `<div class="business-card ${unlocked ? '' : 'locked'}">
            <div class="business-icon">${b.icon}</div>
            <div class="business-info">
                <div class="business-name">${b.name}</div>
                <div class="business-stats">
                    ${bs.owned > 0 ? `${formatNumber(income)}/cycle (${(time/1000).toFixed(1)}s)` : 'Not owned yet'}
                </div>
                <div class="business-owned">
                    ${bs.owned > 0 ? `Owned: ${bs.owned}` : ''}
                    ${hasManager ? ' 👔 Manager' : (bs.owned > 0 ? ` | <a href="#" data-action="manager" data-id="${b.id}" style="color:#a78bfa;text-decoration:none">👔 Hire (${formatNumber(managerCost)})</a>` : '')}
                </div>
                ${bs.owned > 0 ? `<div class="progress-bar"><div class="progress-fill" data-progress="${b.id}" style="width:${progress}%"></div></div>` : ''}
            </div>
            <div>
                ${bs.owned > 0 && !hasManager ? `<button class="buy-btn" style="margin-bottom:5px;background:linear-gradient(135deg,#4caf50,#2e7d32)" data-action="collect" data-id="${b.id}">Collect</button><br>` : ''}
                <button class="buy-btn" data-action="buy" data-id="${b.id}" ${canBuy && unlocked ? '' : 'disabled'}>
                    Buy ${formatNumber(cost)}
                </button>
            </div>
        </div>`;
    });

    panel.innerHTML = html;
}

function renderUpgrades() {
    const panel = document.getElementById('panel-upgrades');
    let html = '';

    UPGRADES.forEach(u => {
        const purchased = state.upgrades[u.id];
        const canBuy = state.coins >= u.cost && !purchased;
        html += `<div class="upgrade-card ${purchased ? 'purchased' : ''}">
            <div class="upgrade-icon">${u.icon}</div>
            <div class="upgrade-info">
                <div class="upgrade-name">${u.name}</div>
                <div class="upgrade-desc">${u.desc}</div>
            </div>
            <button class="buy-btn" data-action="upgrade" data-id="${u.id}" ${canBuy ? '' : 'disabled'}>
                ${purchased ? '✅' : formatNumber(u.cost)}
            </button>
        </div>`;
    });

    panel.innerHTML = html;
}

function renderPrestige() {
    const panel = document.getElementById('panel-prestige');
    const prestigeCoins = getPrestigeCoins();
    const nextMult = 1 + ((state.prestigeLevel + 1) * 0.5);

    panel.innerHTML = `
        <div class="prestige-box">
            <h3>🏢 Go Public</h3>
            <p style="color:#aaa;font-size:0.85em;margin-bottom:10px">
                Reset your progress but gain a permanent earnings multiplier!
            </p>
            <div>Current Level: <strong style="color:#a78bfa">${state.prestigeLevel}</strong></div>
            <div class="prestige-multiplier">${state.prestigeMultiplier}x</div>
            <div style="font-size:0.8em;color:#aaa;margin-top:5px">
                Next: ${nextMult}x (need ${formatNumber(Math.pow(1, 2) * 1000000)} total coins)
            </div>
            <div style="margin-top:10px;font-size:0.9em">
                You will gain: <strong style="color:#ffd700">${prestigeCoins} prestige points</strong>
            </div>
            <button class="prestige-btn" data-action="prestige" ${prestigeCoins >= 1 ? '' : 'disabled'}>
                🏢 Go Public!
            </button>
        </div>
    `;
}

function renderStats() {
    const panel = document.getElementById('panel-stats');
    const playMins = Math.floor(state.totalPlayTime / 60000);

    panel.innerHTML = `
        <div class="stat-row"><span class="stat-label">Total Coins Earned</span><span class="stat-value">${formatNumber(state.totalCoins)}</span></div>
        <div class="stat-row"><span class="stat-label">Total Clicks</span><span class="stat-value">${state.totalClicks.toLocaleString()}</span></div>
        <div class="stat-row"><span class="stat-label">Click Power</span><span class="stat-value">${formatNumber(getClickValue())}</span></div>
        <div class="stat-row"><span class="stat-label">Coins/Second</span><span class="stat-value">${formatNumber(getTotalCPS())}</span></div>
        <div class="stat-row"><span class="stat-label">Prestige Level</span><span class="stat-value">${state.prestigeLevel}</span></div>
        <div class="stat-row"><span class="stat-label">Prestige Multiplier</span><span class="stat-value">${state.prestigeMultiplier}x</span></div>
        <div class="stat-row"><span class="stat-label">Ads Watched</span><span class="stat-value">${state.adsWatched}</span></div>
        <div class="stat-row"><span class="stat-label">Businesses Owned</span><span class="stat-value">${Object.values(state.businesses).reduce((a,b) => a + b.owned, 0)}</span></div>
        <div class="stat-row"><span class="stat-label">Managers Hired</span><span class="stat-value">${Object.values(state.managers).filter(Boolean).length}</span></div>
        <div class="stat-row"><span class="stat-label">Upgrades Bought</span><span class="stat-value">${Object.values(state.upgrades).filter(Boolean).length}</span></div>
        <div class="stat-row"><span class="stat-label">Play Time</span><span class="stat-value">${playMins} min</span></div>
        <div class="stat-row"><span class="stat-label">2x Boost</span><span class="stat-value">${state.boostActive && Date.now() < state.boostEnd ? 'Active' : 'Inactive'}</span></div>
    `;
}

// ========== TAB SWITCHING ==========

document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        updateUI();
    });
});

// ========== SAVE/LOAD ==========

function saveGame() {
    state.lastSave = Date.now();
    localStorage.setItem('coinEmpireSave', JSON.stringify(state));
    analytics.save();
}

function loadGame() {
    const saved = localStorage.getItem('coinEmpireSave');
    if (saved) {
        const loaded = JSON.parse(saved);
        // Merge to handle new properties
        Object.keys(loaded).forEach(k => {
            if (state.hasOwnProperty(k)) state[k] = loaded[k];
        });

        // Offline earnings now handled by checkOfflineEarnings() modal
    }
    state.lastOnline = Date.now();
}

// ========== EVENT LISTENERS ==========

const coinBtn = document.getElementById('coin-button');
coinBtn.addEventListener('click', handleClick);
coinBtn.addEventListener('touchstart', (e) => {
    e.preventDefault(); // Prevent double-fire and 300ms delay on mobile
    handleClick(e);
}, { passive: false });
coinBtn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') handleClick(e);
});

// Event delegation for all game actions — handles both click and touch
function handleGameAction(e) {
    const target = e.target.closest('[data-action]');
    if (!target || target.disabled) return;
    e.preventDefault();
    e.stopPropagation();

    const action = target.dataset.action;
    const id = target.dataset.id;

    switch(action) {
        case 'buy': buyBusiness(id); break;
        case 'collect': collectBusiness(id); break;
        case 'manager': buyManager(id); break;
        case 'upgrade': buyUpgrade(id); break;
        case 'prestige': doPrestige(); break;
        case 'reward-ad': watchRewardAd(); break;
    }
}

// Attach to the game container for delegation
document.querySelector('.game-container').addEventListener('click', handleGameAction);
document.querySelector('.game-container').addEventListener('touchend', handleGameAction, { passive: false });

// ========== ANALYTICS ==========

const analytics = {
    _events: JSON.parse(localStorage.getItem('coinEmpireAnalytics') || '[]'),
    _sessionStart: Date.now(),
    _sessionId: Math.random().toString(36).slice(2, 10),

    track(event, data = {}) {
        const entry = {
            e: event,
            t: Date.now(),
            s: this._sessionId,
            ...data,
        };
        this._events.push(entry);
        // Keep last 1000 events to avoid storage bloat
        if (this._events.length > 1000) {
            this._events = this._events.slice(-800);
        }
    },

    save() {
        try {
            localStorage.setItem('coinEmpireAnalytics', JSON.stringify(this._events));
        } catch(e) { /* storage full, clear old events */
            this._events = this._events.slice(-200);
            localStorage.setItem('coinEmpireAnalytics', JSON.stringify(this._events));
        }
    },

    getSummary() {
        const sessions = {};
        this._events.forEach(ev => {
            if (!sessions[ev.s]) sessions[ev.s] = { start: ev.t, end: ev.t, events: 0 };
            sessions[ev.s].end = Math.max(sessions[ev.s].end, ev.t);
            sessions[ev.s].events++;
        });
        const sessionList = Object.values(sessions);
        const durations = sessionList.map(s => (s.end - s.start) / 1000);
        const totalClicks = this._events.filter(e => e.e === 'click').length;
        const totalBuys = this._events.filter(e => e.e === 'buy').length;
        const totalCollects = this._events.filter(e => e.e === 'collect').length;
        const totalPrestiges = this._events.filter(e => e.e === 'prestige').length;
        const totalAds = this._events.filter(e => e.e === 'ad_watched').length;
        const totalUpgrades = this._events.filter(e => e.e === 'upgrade').length;

        return {
            totalSessions: sessionList.length,
            totalEvents: this._events.length,
            avgSessionDuration: durations.length ? (durations.reduce((a,b) => a+b, 0) / durations.length).toFixed(0) + 's' : '0s',
            totalClicks,
            totalBuys,
            totalCollects,
            totalPrestiges,
            totalAds,
            totalUpgrades,
            lastEvent: this._events.length ? new Date(this._events[this._events.length-1].t).toISOString() : 'never',
        };
    },

    export() {
        return JSON.stringify(this._events, null, 2);
    }
};

// Track session start
analytics.track('session_start');

// ========== DAILY REWARD & OFFLINE EARNINGS ==========

const DAILY_REWARDS = [50, 100, 200, 400, 800, 1500, 3000]; // Day 1-7

function showModal(title, body, buttons) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `<div class="modal-box">
        <div class="modal-title">${title}</div>
        ${body}
        <div id="modal-buttons"></div>
    </div>`;
    document.body.appendChild(overlay);

    const btnContainer = overlay.querySelector('#modal-buttons');
    buttons.forEach(btn => {
        const b = document.createElement('button');
        b.className = 'modal-btn' + (btn.secondary ? ' secondary' : '');
        b.textContent = btn.text;
        b.onclick = () => { overlay.remove(); if (btn.action) btn.action(); };
        btnContainer.appendChild(b);
    });
}

function checkDailyReward() {
    const now = Date.now();
    const lastReward = state.lastDailyReward || 0;
    const hoursSinceLast = (now - lastReward) / (1000 * 60 * 60);

    if (hoursSinceLast < 20) return; // Not enough time (20h to allow some flex)

    // Check if streak continues (within 48h) or resets
    if (hoursSinceLast > 48) {
        state.dailyStreak = 0;
    }

    const day = Math.min(state.dailyStreak, DAILY_REWARDS.length - 1);
    const reward = DAILY_REWARDS[day] * state.prestigeMultiplier;

    state.dailyStreak++;
    state.lastDailyReward = now;

    analytics.track('daily_reward', { day: state.dailyStreak, reward });

    showModal(
        '🎁 Daily Reward!',
        `<div class="modal-reward">+${formatNumber(reward)} coins</div>
         <div class="modal-streak">🔥 Day ${state.dailyStreak} streak${state.dailyStreak >= 7 ? ' (MAX!)' : ''}</div>
         <div style="font-size:0.75em;color:#aaa">Come back tomorrow for more!</div>`,
        [{ text: 'Collect!', action: () => {
            state.coins += reward;
            state.totalCoins += reward;
            showToast(`Daily reward: +${formatNumber(reward)} coins!`);
            updateUI();
            saveGame();
        }}]
    );
}

function checkOfflineEarnings() {
    const offlineTime = Date.now() - state.lastOnline;
    if (offlineTime < 30000) return; // Less than 30s, skip

    const cps = getTotalCPS();
    if (cps <= 0) return;

    const baseEarnings = cps * (offlineTime / 1000) * 0.5; // 50% offline efficiency
    if (baseEarnings < 1) return;

    state.coins += baseEarnings;
    state.totalCoins += baseEarnings;

    const mins = Math.floor(offlineTime / 60000);
    const timeStr = mins >= 60 ? `${Math.floor(mins/60)}h ${mins%60}m` : `${mins}m`;

    analytics.track('offline_earnings', { earnings: baseEarnings, offlineTime });

    showModal(
        '👋 Welcome Back!',
        `<div style="color:#aaa;margin-bottom:10px">You were away for ${timeStr}</div>
         <div class="modal-reward">+${formatNumber(baseEarnings)} coins</div>
         <div style="font-size:0.8em;color:#aaa;margin-top:5px">earned at 50% efficiency</div>`,
        [
            { text: 'Collect', action: () => { updateUI(); saveGame(); } },
            { text: '🎥 2x (Watch Ad)', secondary: true, action: () => {
                state.coins += baseEarnings; // Double it
                state.totalCoins += baseEarnings;
                state.adsWatched++;
                analytics.track('ad_watched', { type: 'offline_double' });
                showToast(`Doubled! +${formatNumber(baseEarnings * 2)} total offline earnings!`);
                updateUI();
                saveGame();
            }}
        ]
    );
}

// ========== INIT ==========

loadGame();
updateUI();

// Show offline earnings then daily reward (with slight delays so they don't stack)
setTimeout(() => checkOfflineEarnings(), 300);
setTimeout(() => checkDailyReward(), 800);

// Game loop - 50ms tick (20fps, smooth enough for idle game)
setInterval(gameTick, 50);

// Auto-save every 30 seconds
setInterval(saveGame, 30000);

// Save on close
window.addEventListener('beforeunload', saveGame);

// Track online time
setInterval(() => { state.lastOnline = Date.now(); }, 5000);

// ========== ONBOARDING ==========

const onboarding = {
    step: parseInt(localStorage.getItem('coinEmpireOnboarding') || '0'),
    hints: [
        { text: '👆 Tap the coin to earn!', target: 'coin-button', offsetY: -70 },
        { text: '🏪 Buy your first business!', target: 'panel-businesses', offsetY: -40 },
        { text: '✨ You\'re a natural! Keep growing!', target: null, offsetY: 0 },
    ],
    el: null,

    show() {
        if (this.step >= this.hints.length) return;
        const hint = this.hints[this.step];
        if (this.el) this.el.remove();

        // Check conditions
        if (this.step === 0 && state.totalClicks > 0) { this.advance(); return; }
        if (this.step === 1 && Object.values(state.businesses).some(b => b.owned > 0)) { this.advance(); return; }
        if (this.step === 2) {
            // Show briefly then dismiss
            this.el = document.createElement('div');
            this.el.className = 'onboarding-hint';
            this.el.textContent = hint.text;
            this.el.style.left = '50%';
            this.el.style.top = '45%';
            this.el.style.transform = 'translateX(-50%)';
            document.body.appendChild(this.el);
            setTimeout(() => { if (this.el) this.el.remove(); }, 3000);
            this.advance();
            return;
        }

        if (!hint.target) return;
        const targetEl = document.getElementById(hint.target);
        if (!targetEl) return;

        this.el = document.createElement('div');
        this.el.className = 'onboarding-hint';
        this.el.textContent = hint.text;
        const r = targetEl.getBoundingClientRect();
        this.el.style.left = (r.left + r.width / 2) + 'px';
        this.el.style.top = (r.top + hint.offsetY) + 'px';
        this.el.style.transform = 'translateX(-50%)';
        document.body.appendChild(this.el);
    },

    advance() {
        this.step++;
        localStorage.setItem('coinEmpireOnboarding', this.step.toString());
        if (this.el) { this.el.remove(); this.el = null; }
        this.show();
    },

    check() {
        if (this.step === 0 && state.totalClicks > 0) this.advance();
        else if (this.step === 1 && Object.values(state.businesses).some(b => b.owned > 0)) this.advance();
    }
};

// Show onboarding after a short delay (only for new players)
if (onboarding.step < onboarding.hints.length) {
    setTimeout(() => onboarding.show(), 500);
    // Check onboarding progress periodically
    setInterval(() => onboarding.check(), 1000);
}

</script>
